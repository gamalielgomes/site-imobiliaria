<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Entrar | Aurora Imóveis</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/site.js" defer></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body data-page="login" class="auth-page">
    <main class="auth-layout">
      <a class="brand auth-brand" href="index.html"><img class="brand-logo" src="assets/aurora-imoveis-logo-light.svg" width="360" height="84" alt="Aurora Imóveis" /><span class="brand-creci" data-creci></span></a>
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">Área restrita</p>
        <h1 id="login-title">Acesse o painel.</h1>
        <p>Use o e-mail e a senha cadastrados no Supabase.</p>
        <form id="login-form" class="auth-form">
          <label><span>E-mail</span><input name="email" type="email" autocomplete="email" required /></label>
          <label><span>Senha</span><input name="password" type="password" autocomplete="current-password" minlength="6" required /></label>
          <p class="form-message" id="login-message" aria-live="polite"></p>
          <button class="button button-primary button-full" type="submit">Entrar no painel</button>
        </form>
        <a class="back-link" href="index.html">← Voltar ao site</a>
      </section>
    </main>
  </body>
</html>
