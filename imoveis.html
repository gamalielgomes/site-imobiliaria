<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Veja imóveis disponíveis para venda e aluguel em Belo Jardim." />
    <title>Imóveis | Aurora Imóveis</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/site.js" defer></script>
    <script src="js/properties.js" defer></script>
  </head>
  <body data-page="properties">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header site-header-solid" data-header>
      <div class="container nav-wrap">
        <a class="brand" href="index.html"><img class="brand-logo" src="assets/aurora-imoveis-logo.svg" width="360" height="84" alt="Aurora Imóveis" /><span class="brand-creci" data-creci></span></a>
        <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" data-nav-toggle><span></span><span></span><span></span></button>
        <nav class="site-nav" aria-label="Navegação principal" data-nav>
          <a href="index.html">Início</a><a class="active" href="imoveis.html">Imóveis</a><a href="index.html#sobre">A imobiliária</a><a href="index.html#contato">Contato</a><a class="button button-small button-dark" data-whatsapp-link href="#" target="_blank" rel="noopener">WhatsApp</a>
        </nav>
      </div>
    </header>
    <main id="conteudo">
      <section class="page-intro">
        <div class="container">
          <p class="eyebrow">Oportunidades para você</p>
          <h1>Encontre um lugar para chamar de seu.</h1>
          <p>Use os filtros para encontrar imóveis que combinam com o seu momento.</p>
        </div>
      </section>
      <section class="listing-section section">
        <div class="container">
          <form class="listing-filters" id="listing-filters">
            <label><span>Negócio</span><select name="finalidade"><option value="">Comprar ou alugar</option><option value="Venda">Comprar</option><option value="Aluguel">Alugar</option></select></label>
            <label><span>Tipo</span><select name="tipo"><option value="">Todos os tipos</option><option value="Casa">Casa</option><option value="Apartamento">Apartamento</option><option value="Terreno">Terreno</option><option value="Comercial">Comercial</option></select></label>
            <label><span>Cidade</span><select name="cidade"><option value="">Toda a cidade</option><option value="Belo Jardim">Belo Jardim</option></select></label>
            <label><span>Bairro</span><select name="bairro" data-neighborhood-filter><option value="">Todos os bairros</option></select></label>
            <button class="button button-primary" type="submit">Aplicar filtros</button>
            <button class="button button-ghost" id="clear-filters" type="button">Limpar</button>
          </form>
          <div class="listing-meta"><p id="property-count" aria-live="polite">Carregando imóveis…</p></div>
          <div class="property-grid" id="property-list" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <footer class="site-footer compact-footer"><div class="container footer-bottom"><span>© <span data-current-year></span> Aurora Imóveis. Todos os direitos reservados. <span data-creci></span></span><a href="login.html">Área do administrador</a></div></footer>
  </body>
</html>
